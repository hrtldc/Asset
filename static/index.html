<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D USD 资产展示平台 - Cyber Studio</title>
  <link rel="stylesheet" href="css/style.css?v=20260914_v7">
</head>
<body style="background-color: #050811; color: #f8fafc;">

  <!-- Top Header Navigation -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">
            3D USD 资产展示平台
            <span class="brand-badge">Cyber Studio</span>
          </h1>
          <p class="brand-subtitle">SimReady & OpenUSD 资产元宇宙 · 360° 旋转视频沉浸预览与极速打包下载</p>
        </div>
      </div>

      <!-- Main Toolbar -->
      <div class="toolbar">
        <!-- Search -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索资产名称、分类、批次..." autocomplete="off">
        </div>

        <!-- Media Filter -->
        <select id="mediaFilterSelect" class="select-filter">
          <option value="all">全部模型</option>
          <option value="video">仅看含 360° 视频</option>
          <option value="usd">仅看含 USD 网格</option>
        </select>

        <!-- Sort By -->
        <select id="sortSelect" class="select-filter">
          <option value="name">按名称排序</option>
          <option value="category">按类别归类</option>
          <option value="batch">按批次分组</option>
          <option value="size">按文件大小</option>
        </select>

        <!-- Preview View Mode Toggle -->
        <div class="toggle-group">
          <button id="modeThumbBtn" class="toggle-btn active" title="悬停自动播放 360° 旋转视频">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            缩略图 (悬停视频)
          </button>
          <button id="modeVideoBtn" class="toggle-btn" title="在预览页直接同时循环播放所有旋转视频">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            视频墙模式
          </button>
        </div>

        <!-- One-Click Full Update Button -->
        <button id="updateAllBtn" class="btn-update-all" title="全量重新扫描 G:\Simreay\output 磁盘并强刷最新图片与视频">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          一键同步更新
        </button>
      </div>
    </div>
  </header>

  <!-- Quick Stats Bar -->
  <section class="stats-bar">
    <div class="stats-badges">
      <div class="stat-pill active-pill">
        <span>当前显示:</span>
        <strong id="filteredCount">0</strong> / <span id="totalAssetsCount">0</span>
      </div>
      <div class="stat-pill">
        <span>🎬 360° 旋转视频:</span>
        <strong id="videosCount">0</strong> 个
      </div>
      <div class="stat-pill">
        <span>📦 USD 网格:</span>
        <strong id="usdCount">0</strong> 套
      </div>
      <div class="stat-pill">
        <span>💾 资源总容量:</span>
        <strong id="totalSize">0 GB</strong>
      </div>
    </div>
  </section>

  <!-- Category & Batch Switcher Header -->
  <div class="strip-header">
    <div class="strip-toggle-group">
      <button id="stripModeCategory" class="strip-mode-btn active">🏷️ 按模型类别筛选</button>
      <button id="stripModeBatch" class="strip-mode-btn">📁 按生产批次筛选</button>
    </div>
  </div>

  <!-- Horizontal Chips Navigation Strip (Categories by default) -->
  <nav class="batch-strip" id="filterChips">
    <!-- Populated by JS -->
  </nav>

  <!-- Main Grid Gallery -->
  <main class="main-content">
    <div class="asset-grid" id="assetGrid">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- Asset Detail & Download Modal Dialog (Cyber Sci-Fi Glassmorphism) -->
  <div class="modal-backdrop" id="assetModal">
    <div class="modal-container">
      <!-- Modal Header -->
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 id="modalTitle">资产名称</h2>
          <p id="modalSubtitle">详细标识</p>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn" title="关闭 (Esc)">✕</button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <!-- Left: Media Player / Preview -->
        <div class="modal-media-col">
          <div class="media-viewer">
            <video id="modalVideoPlayer" loop controls playsinline></video>
            <img id="modalImagePreview" style="display:none;" alt="Preview">
          </div>
          <!-- Tabs switch between video & image -->
          <div class="media-controls-tab">
            <button id="modalVideoTabBtn" class="media-tab-btn active">🎬 360° 旋转视频</button>
            <button id="modalImageTabBtn" class="media-tab-btn">🖼 高清渲染图</button>
          </div>
        </div>

        <!-- Right: Information & Downloads -->
        <div class="modal-info-col">
          <!-- Primary Download Action -->
          <div class="info-section">
            <a id="modalDownloadZip" class="download-primary-btn" href="#">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              一键打包下载完整资产 (ZIP)
            </a>
            <p style="font-size: 0.78rem; color: #94a3b8; text-align: center; margin-top: 4px;">
              打包包含：USD/USDC 物理网格、Materials 材质库与贴图、360° 视频与高清渲染图
            </p>
          </div>

          <!-- Quick USD Mesh Download -->
          <div class="info-section">
            <div class="section-label">快速下载 USD 网格</div>
            <div class="download-quick-row" id="modalQuickUsdRow">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Local Desktop Integration -->
          <div class="info-section" style="margin-top: auto; padding-top: 16px;">
            <div class="section-label">本地开发集成 (Isaac Sim / Omniverse)</div>
            <div class="tools-row">
              <button class="btn-tool" id="modalOpenFolderBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                在 Windows 资源管理器中打开
              </button>
              <button class="btn-tool" id="modalCopyPathBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                复制本地绝对路径
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=20260914_v7"></script>
</body>
</html>
