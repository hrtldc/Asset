<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>资源不存在 · 3D USD 资产平台</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0f14; color: #e6edf3; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .panel {
      max-width: 560px; width: 100%; padding: 40px 36px;
      background: #111820; border: 1px solid #1f2a37; border-radius: 12px;
    }
    .code { font-size: 13px; letter-spacing: 2px; color: #f0883e; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.7; color: #9aa7b4; margin: 0 0 12px; }
    ul { font-size: 13px; line-height: 1.9; color: #9aa7b4; margin: 0 0 18px; padding-left: 20px; }
    code { color: #7ee787; background: #0b0f14; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    a {
      display: inline-block; margin-top: 8px; padding: 9px 18px; border-radius: 8px;
      background: #1f6feb; color: #fff; text-decoration: none; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="code">404 · NOT FOUND</div>
    <h1>这个资源不存在</h1>
    <p>你请求的文件没有部署到当前版本的站点上。这通常意味着：</p>
    <ul>
      <li>最近一次同步只完成了一半，媒体文件还没上传成功；</li>
      <li>该资产所属的批次已被过滤规则排除；</li>
      <li>或者链接本身拼写有误。</li>
    </ul>
    <p>维护者可以在本地运行 <code>python verify_sync.py</code> 定位具体的缺失项。</p>
    <a href="/">返回资产总览</a>
  </div>
</body>
</html>
